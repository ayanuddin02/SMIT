<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <H1>STUDENT REGISTRATION FORM</H1>
    <form action="">
        <label for="">Full Name:
            <input type="text" placeholder="Enter your name">
        </label> <br><br>
        <label for="">Email:
            <input type="email" placeholder="Enter your email" >
        </label><br><br>
        <label for="">Password:
            <input type="password" placeholder="Enter your password">
        </label><br><br>
        <label for="">Age:
            <input type="age" placeholder="Enter your age">
        </label><br><br>
        <label for="">Date of Birth: 
            <input type="date" value="date of birth">
        </label><br><br>
        <label for="">Gender:
           <input type="radio" name="gender" value="male">Male
        </label>
        <label for="">
            <input type="radio" name="gender" value="Female">Female
        </label><br><br>
        <label for="">
        Select Course:
        </label>
      <select name="" id="">
        <option value="">Select Course</option>
        <option value="">Web Development</option>
        <option value="">Digital Marketing</option>
        <option value="">Graphic Designing</option>
        <option value="">Python</option>
      </select><br><br>
      <label for="">Phone Number:
        <input type="tel" placeholder="03XXXXXXXXX">
      </label><br><br>
    <label for="">Address:</label>
<br>
    <textarea name="address" rows="6" cols="40"></textarea>
    <br><br>
    <label for="">Hobbies: <br>
        <input type="checkbox">Coding <br>
        <input type="checkbox">Reading <br>
        <input type="checkbox">Sports <br>
    </label><br><br>
    <label for="">Upload Photo:
        <input type="file" value="Choosec File">
    </label><br><br>
    <label for="">
        <input type="submit" value="Register">
        <input type="submit" value="Resett">
    </label>


    </form>
</body>
</html>
